<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="540" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">CROSS JOIN</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">結合条件なしで、両方のテーブルの行をすべて組み合わせる</text>

  <!-- ===== テーブルA ===== -->
  <text x="130" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">テーブルA</text>
  <rect x="40" y="160" width="180" height="40" fill="#3B82F6"/>
  <text x="70" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="160" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <rect x="40" y="200" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="226" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="160" y="226" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <rect x="40" y="240" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="266" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="160" y="266" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <line x1="100" y1="160" x2="100" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 行の色マーク -->
  <rect x="34" y="202" width="6" height="36" fill="#8B5CF6"/>
  <rect x="34" y="242" width="6" height="36" fill="#F59E0B"/>

  <!-- ===== 組み合わせの線 ===== -->
  <line x1="222" y1="220" x2="318" y2="220" stroke="#8B5CF6" stroke-width="2.5"/>
  <line x1="222" y1="220" x2="318" y2="260" stroke="#8B5CF6" stroke-width="2.5"/>
  <line x1="222" y1="260" x2="318" y2="220" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="222" y1="260" x2="318" y2="260" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="222" cy="220" r="4" fill="#8B5CF6"/>
  <circle cx="222" cy="260" r="4" fill="#F59E0B"/>
  <circle cx="318" cy="220" r="4" fill="#6B7280"/>
  <circle cx="318" cy="260" r="4" fill="#6B7280"/>

  <!-- ===== テーブルB ===== -->
  <text x="400" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">テーブルB</text>
  <rect x="320" y="160" width="160" height="40" fill="#10B981"/>
  <text x="350" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="430" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="320" y="200" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="350" y="226" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="430" y="226" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="320" y="240" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="350" y="266" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="430" y="266" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <line x1="380" y1="160" x2="380" y2="280" stroke="#FFFFFF" stroke-width="2"/>

  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#6B7280">※ ON句なし：IDが一致しなくてもすべての行同士を組み合わせる</text>

  <!-- ===== 矢印 ===== -->
  <text x="550" y="228" text-anchor="middle" font-size="11" fill="#6B7280">すべての組み合わせ</text>
  <line x1="495" y1="240" x2="606" y2="240" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== 結果 ===== -->
  <text x="740" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D28D9">結果</text>
  <rect x="620" y="120" width="240" height="40" fill="#8B5CF6"/>
  <text x="650" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="725" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <text x="815" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="620" y="160" width="240" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="650" y="186" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="725" y="186" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="815" y="186" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="620" y="200" width="240" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="650" y="226" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="725" y="226" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="815" y="226" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="620" y="240" width="240" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="650" y="266" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="725" y="266" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="815" y="266" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="620" y="280" width="240" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="650" y="306" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="725" y="306" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="815" y="306" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <line x1="680" y1="120" x2="680" y2="320" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="770" y1="120" x2="770" y2="320" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="614" y="162" width="6" height="76" fill="#8B5CF6"/>
  <rect x="614" y="242" width="6" height="76" fill="#F59E0B"/>
  <text x="740" y="345" text-anchor="middle" font-size="12" fill="#6B7280">2行 × 2行 ＝ 4行</text>

  <!-- ===== 区切り線 ===== -->
  <line x1="40" y1="370" x2="860" y2="370" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ===== 組み合わせ表 ===== -->
  <rect x="60" y="390" width="100" height="36" fill="#F3F4F6" stroke="#FFFFFF" stroke-width="2"/>
  <text x="110" y="413" text-anchor="middle" font-size="12" fill="#6B7280">A ＼ B</text>
  <rect x="160" y="390" width="110" height="36" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="215" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">25</text>
  <rect x="270" y="390" width="110" height="36" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="325" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">30</text>
  <rect x="60" y="426" width="100" height="40" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
  <text x="110" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">田中</text>
  <rect x="60" y="466" width="100" height="40" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
  <text x="110" y="491" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">鈴木</text>
  <rect x="160" y="426" width="110" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="215" y="451" text-anchor="middle" font-size="13" fill="#1F2937">田中 × 25</text>
  <rect x="270" y="426" width="110" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="325" y="451" text-anchor="middle" font-size="13" fill="#1F2937">田中 × 30</text>
  <rect x="160" y="466" width="110" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="215" y="491" text-anchor="middle" font-size="13" fill="#1F2937">鈴木 × 25</text>
  <rect x="270" y="466" width="110" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="325" y="491" text-anchor="middle" font-size="13" fill="#1F2937">鈴木 × 30</text>

  <text x="420" y="428" font-size="16" font-weight="bold" fill="#111827">CROSS JOIN ＝ すべての組み合わせ（直積）</text>
  <text x="420" y="456" font-size="13" fill="#4B5563">結果の行数は「Aの行数 × Bの行数」になります。</text>
  <text x="420" y="478" font-size="13" fill="#4B5563">例：1,000行 × 1,000行 ＝ 1,000,000行。</text>
  <text x="420" y="500" font-size="13" fill="#4B5563">大きなテーブル同士では行数が爆発するので注意が必要です。</text>
</svg>
