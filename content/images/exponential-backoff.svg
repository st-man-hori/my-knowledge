  <!-- ===== 指数バックオフ ===== -->
  <text x="109" y="265" font-size="15" font-weight="bold" fill="#1D4ED8">指数バックオフ（1秒 → 2秒 → 4秒 → 8秒）</text>
  <text x="840" y="265" text-anchor="end" font-size="14" font-weight="bold" fill="#047857">リクエスト 5回</text>
  <rect x="120" y="314" width="45" height="12" fill="#DBEAFE"/>
  <text x="142.5" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">1秒</text>
  <rect x="165" y="314" width="90" height="12" fill="#DBEAFE"/>
  <text x="210" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">待機 2秒</text>
