<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="545" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">FULL JOIN</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">両方のテーブルの行がすべて残り、一致しない側の値は NULL になる</text>

  <!-- ===== テーブルA ===== -->
  <text x="130" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">テーブルA（左）</text>
  <rect x="40" y="120" width="180" height="40" fill="#3B82F6"/>
  <text x="70" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="160" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <rect x="40" y="160" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="186" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="160" y="186" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <rect x="40" y="200" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="226" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="160" y="226" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <rect x="40" y="240" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="266" text-anchor="middle" font-size="14" fill="#1F2937">3</text>
  <text x="160" y="266" text-anchor="middle" font-size="14" fill="#1F2937">佐藤</text>
  <rect x="40" y="280" width="180" height="40" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="70" y="306" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="160" y="306" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <rect x="41" y="321" width="178" height="38" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="130" y="345" text-anchor="middle" font-size="12" fill="#B45309">一致なし → NULL</text>
  <line x1="100" y1="120" x2="100" y2="320" stroke="#FFFFFF" stroke-width="2"/>
  <text x="130" y="385" text-anchor="middle" font-size="12" fill="#6B7280">※ 左のテーブルは全行が結果に残る</text>

  <!-- ===== A と B の対応線 ===== -->
  <line x1="222" y1="180" x2="298" y2="180" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="222" cy="180" r="4" fill="#8B5CF6"/><circle cx="298" cy="180" r="4" fill="#8B5CF6"/>
  <line x1="222" y1="220" x2="298" y2="220" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="222" cy="220" r="4" fill="#8B5CF6"/><circle cx="298" cy="220" r="4" fill="#8B5CF6"/>
  <line x1="222" y1="300" x2="298" y2="300" stroke="#8B5CF6" stroke-width="2.5"/>
  <circle cx="222" cy="300" r="4" fill="#8B5CF6"/><circle cx="298" cy="300" r="4" fill="#8B5CF6"/>
  <!-- ID3（Aのみ）も残る -->
  <line x1="222" y1="260" x2="298" y2="260" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="222" cy="260" r="4" fill="#F59E0B"/>
  <!-- ID5（Bのみ）も残る -->
  <line x1="222" y1="340" x2="298" y2="340" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="298" cy="340" r="4" fill="#F59E0B"/>

  <!-- ===== テーブルB ===== -->
  <text x="380" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">テーブルB（右）</text>
  <rect x="300" y="120" width="160" height="40" fill="#10B981"/>
  <text x="330" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="410" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="300" y="160" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="186" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="410" y="186" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="300" y="200" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="226" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="410" y="226" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="301" y="241" width="158" height="38" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="265" text-anchor="middle" font-size="12" fill="#B45309">一致なし → NULL</text>
  <rect x="300" y="280" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="306" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="410" y="306" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <rect x="300" y="320" width="160" height="40" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="330" y="346" text-anchor="middle" font-size="14" fill="#1F2937">5</text>
  <text x="410" y="346" text-anchor="middle" font-size="14" fill="#1F2937">22</text>
  <line x1="360" y1="120" x2="360" y2="240" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="360" y1="280" x2="360" y2="360" stroke="#FFFFFF" stroke-width="2"/>
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#6B7280">※ 右のテーブルも全行が結果に残る</text>

  <!-- ===== 矢印 ===== -->
  <text x="530" y="248" text-anchor="middle" font-size="11" fill="#6B7280">ON A.id = B.id</text>
  <line x1="478" y1="260" x2="586" y2="260" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== 結果 ===== -->
  <text x="730" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D28D9">結果</text>
  <rect x="600" y="120" width="260" height="40" fill="#8B5CF6"/>
  <text x="630" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="710" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <text x="810" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="600" y="160" width="260" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="186" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="710" y="186" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="810" y="186" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="600" y="200" width="260" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="226" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="710" y="226" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="810" y="226" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="600" y="240" width="260" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="760" y="240" width="100" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="266" text-anchor="middle" font-size="14" fill="#1F2937">3</text>
  <text x="710" y="266" text-anchor="middle" font-size="14" fill="#1F2937">佐藤</text>
  <text x="810" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <rect x="600" y="280" width="260" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="306" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="710" y="306" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <text x="810" y="306" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <rect x="600" y="320" width="260" height="40" fill="#EDE9FE" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="600" y="320" width="160" height="40" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="710" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="810" y="346" text-anchor="middle" font-size="14" fill="#1F2937">22</text>
  <line x1="660" y1="120" x2="660" y2="360" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="760" y1="120" x2="760" y2="360" stroke="#FFFFFF" stroke-width="2"/>
  <text x="730" y="385" text-anchor="middle" font-size="12" fill="#6B7280">A・B両方の行が残る（計5行）</text>

  <!-- ===== 区切り線 ===== -->
  <line x1="40" y1="405" x2="860" y2="405" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ===== ベン図 ===== -->
  <circle cx="150" cy="470" r="55" fill="#8B5CF6"/>
  <circle cx="220" cy="470" r="55" fill="#8B5CF6"/>
  <circle cx="150" cy="470" r="55" fill="none" stroke="#6D28D9" stroke-width="2"/>
  <circle cx="220" cy="470" r="55" fill="none" stroke="#6D28D9" stroke-width="2"/>
  <text x="122" y="475" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="248" y="475" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="185" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">共通</text>

  <text x="310" y="458" font-size="16" font-weight="bold" fill="#111827">FULL JOIN ＝ A と B の全体を取得</text>
  <text x="310" y="486" font-size="13" fill="#4B5563">一致する行は結合し、どちらか一方にしか無い行もすべて結果に含めます。</text>
  <text x="310" y="508" font-size="13" fill="#4B5563">相手側に一致する行が無い場合、その列は NULL で埋められます。</text>
</svg>
