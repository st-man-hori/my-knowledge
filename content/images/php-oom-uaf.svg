<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <marker id="arrow-blue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="900" height="800" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">CVE-2026-109618: OOM時のUse-After-Free</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#4B5563">メモリ不足で処理を強制中断すると、後片付け(shutdown)が壊れたメモリを正常として扱ってしまう</text>

  <!-- タイムライン 3ステップ -->
  <rect x="30" y="90" width="260" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="160" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A8A">① リクエスト受付</text>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="#1E3A8A">ボディ解析中(初期化半ば)</text>

  <line x1="290" y1="123" x2="320" y2="123" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue2)"/>

  <rect x="320" y="90" width="260" height="66" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">② memory_limit到達</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#991B1B">OOM発生</text>

  <line x1="580" y1="123" x2="610" y2="123" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red2)"/>

  <rect x="610" y="90" width="260" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="740" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">③ longjmp()で強制中断</text>
  <text x="740" y="138" text-anchor="middle" font-size="12" fill="#92400E">今の処理を飛び越えて脱出</text>

  <!-- 分岐 -->
  <line x1="740" y1="156" x2="740" y2="185" stroke="#6B7280" stroke-width="2"/>
  <line x1="740" y1="185" x2="225" y2="185" stroke="#6B7280" stroke-width="2"/>
  <line x1="740" y1="185" x2="675" y2="185" stroke="#6B7280" stroke-width="2"/>
  <line x1="225" y1="185" x2="225" y2="210" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-blue2)"/>
  <line x1="675" y1="185" x2="675" y2="210" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-blue2)"/>

  <!-- 左パネル: mod_php / FrankenPHP -->
  <rect x="95" y="212" width="260" height="30" rx="15" fill="#374151"/>
  <text x="225" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">mod_php / FrankenPHP</text>

  <rect x="40" y="252" width="370" height="300" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>

  <rect x="60" y="272" width="330" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">起動失敗でも無条件に</text>
  <text x="225" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">shutdown処理を実行</text>

  <line x1="225" y1="326" x2="225" y2="346" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red2)"/>

  <rect x="60" y="348" width="330" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">未初期化のメモリ構造を</text>
  <text x="225" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#991B1B">正常として扱ってしまう</text>

  <line x1="225" y1="402" x2="225" y2="422" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red2)"/>

  <rect x="60" y="424" width="330" height="48" rx="8" fill="#FECACA" stroke="#991B1B" stroke-width="1.5"/>
  <text x="225" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#7F1D1D">UAF / 不正ポインタ参照</text>

  <line x1="225" y1="472" x2="225" y2="492" stroke="#991B1B" stroke-width="2" marker-end="url(#arrow-red2)"/>

  <rect x="70" y="494" width="310" height="34" rx="17" fill="#991B1B"/>
  <text x="225" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">mod_phpで完全なRCEを実証済み</text>

  <!-- 右パネル: PHP-FPM -->
  <rect x="545" y="212" width="260" height="30" rx="15" fill="#374151"/>
  <text x="675" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">PHP-FPM</text>

  <rect x="490" y="252" width="370" height="300" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>

  <rect x="510" y="272" width="330" height="54" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="675" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">起動失敗時は</text>
  <text x="675" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">子プロセスごと終了</text>

  <line x1="675" y1="326" x2="675" y2="346" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-green2)"/>

  <rect x="510" y="348" width="330" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="675" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">起動成功後にOOMへ至る</text>
  <text x="675" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">経路は理論上残る</text>
  <text x="675" y="406" text-anchor="middle" font-size="12" fill="#92400E">(完全なPoCは未実証)</text>

  <line x1="675" y1="418" x2="675" y2="438" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber2)"/>

  <rect x="520" y="440" width="310" height="34" rx="17" fill="#B45309"/>
  <text x="675" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">安全とは言い切れない</text>

  <text x="675" y="500" text-anchor="middle" font-size="12" fill="#4B5563">(mod_phpほど単純には</text>
  <text x="675" y="520" text-anchor="middle" font-size="12" fill="#4B5563">攻撃が成立しない)</text>

  <!-- 攻撃経路 -->
  <rect x="30" y="572" width="840" height="100" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="55" y="598" font-size="13" font-weight="bold" fill="#374151">攻撃者が使う入口: multipart/form-data リクエスト</text>
  <text x="55" y="622" font-size="12" fill="#4B5563">・Content-Lengthを省略して post_max_size のチェックを回避する</text>
  <text x="55" y="644" font-size="12" fill="#4B5563">・1つのパートに無制限のヘッダーを詰め込み、見た目以上にメモリを消費させる</text>
  <text x="55" y="660" font-size="12" fill="#4B5563">・空のファイル項目は max_file_uploads の上限を回避しつつメタデータ配列を生成させる</text>

  <!-- 対応 -->
  <rect x="30" y="686" width="840" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="55" y="712" font-size="13" fill="#047857">◯ 修正(8.2.35 / 8.3.36 / 8.4.27 / 8.5.12〜): longjmpを廃止し、セーフポイントでのsoft OOMと_exit()によるhard OOMに置き換え</text>
  <text x="55" y="738" font-size="13" fill="#B45309">△ 緩和(更新までの応急処置): memory_limit=-1 を管理者設定で強制、post_max_size・入力ネスト数・入力変数数を厳しく制限</text>
  <text x="55" y="762" font-size="12" fill="#6B7280">※ いずれも完全な対策ではない。確実なのはPHP本体の更新のみ。</text>
</svg>
