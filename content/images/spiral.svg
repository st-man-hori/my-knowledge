  <circle cx="438" cy="300" r="5" fill="#1D4ED8"/>
  <text x="432" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#1D4ED8">開始</text>

  <!-- 周ごとの成果物 -->
  <circle cx="492.0" cy="300" r="6" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <text x="500.0" y="320" font-size="11" font-weight="bold" fill="#047857">試作①</text>
  <circle cx="552.0" cy="300" r="6" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <text x="560.0" y="320" font-size="11" font-weight="bold" fill="#047857">試作②</text>
  <circle cx="612.0" cy="300" r="6" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <text x="620.0" y="320" font-size="11" font-weight="bold" fill="#047857">試作③</text>
  <text x="230" y="296" text-anchor="end" font-size="15" font-weight="bold" fill="#1D4ED8">完成・</text>
  <text x="230" y="316" text-anchor="end" font-size="15" font-weight="bold" fill="#1D4ED8">リリース</text>

  <!-- 補足 -->
  <text x="450" y="545" text-anchor="middle" font-size="13" fill="#4B5563">周回を重ねるごとにリスクを減らしながら、システムを少しずつ完成に近づけていく</text>
</svg>
