  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="570" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">スパイラルモデル</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">「計画 → リスク分析 → 実装 → 評価」を1周として、らせん状に繰り返す</text>

  <!-- ===== 4つのフェーズ ===== -->
  <rect x="240" y="90" width="210" height="210" fill="#EFF6FF"/>
  <text x="254" y="116" text-anchor="start" font-size="16" font-weight="bold" fill="#1D4ED8">計画</text>
  <text x="254" y="134" text-anchor="start" font-size="11" fill="#374151">目標・要件を決める</text>
  <rect x="450" y="90" width="210" height="210" fill="#FFFBEB"/>
  <text x="646" y="116" text-anchor="end" font-size="16" font-weight="bold" fill="#B45309">リスク分析</text>
  <text x="646" y="134" text-anchor="end" font-size="11" fill="#374151">リスクを洗い出し対策する</text>
  <rect x="450" y="300" width="210" height="210" fill="#ECFDF5"/>
  <text x="646" y="480" text-anchor="end" font-size="16" font-weight="bold" fill="#047857">実装</text>
  <text x="646" y="498" text-anchor="end" font-size="11" fill="#374151">開発・テストする</text>
  <rect x="240" y="300" width="210" height="210" fill="#F5F3FF"/>
  <text x="254" y="480" text-anchor="start" font-size="16" font-weight="bold" fill="#6D28D9">評価</text>
  <text x="254" y="498" text-anchor="start" font-size="11" fill="#374151">結果を確認し次の周へ</text>
  <line x1="240" y1="300" x2="660" y2="300" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="450" y1="90" x2="450" y2="510" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>

