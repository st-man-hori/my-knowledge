<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="640" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">SSR（サーバーサイドレンダリング）</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">リクエストのたびに、サーバー側でJavaScriptを動かして中身入りのHTMLを作る</text>

  <!-- 登場人物 -->
  <rect x="190" y="100" width="160" height="40" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="270" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A8A">ブラウザ</text>
  <rect x="570" y="100" width="160" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="650" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">サーバー</text>
  <line x1="270" y1="140" x2="270" y2="455" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="650" y1="140" x2="650" y2="455" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ===== アクセス（毎回） ===== -->
  <line x1="30" y1="160" x2="870" y2="160" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="30" y="148" width="132" height="24" rx="12" fill="#374151"/>
  <text x="96" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">アクセス（毎回）</text>
  <line x1="274" y1="205" x2="644" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="460.0" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">① /products をリクエスト</text>
  <rect x="665" y="178" width="190" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">その場でHTMLを組み立てる</text>
  <text x="760" y="218.0" text-anchor="middle" font-size="12" fill="#065F46">1. DB・APIからデータ取得</text>
  <text x="760" y="236.0" text-anchor="middle" font-size="12" fill="#065F46">2. React などで HTML を生成</text>
  <line x1="646" y1="275" x2="276" y2="275" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="460.0" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">② 中身入りのHTML ＋ JavaScript</text>
  <rect x="366.0" y="263" width="128" height="24" rx="5" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="430.0" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">HTML（中身あり）</text>
  <rect x="504.0" y="263" width="50" height="24" rx="5" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="529.0" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">JS</text>
  <rect x="60" y="185" width="140" height="86" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M60,191 a6,6 0 0 1 6,-6 h128 a6,6 0 0 1 6,6 v8 h-140 z" fill="#E5E7EB"/>
  <circle cx="68" cy="192" r="2.2" fill="#F87171"/><circle cx="75" cy="192" r="2.2" fill="#FBBF24"/><circle cx="82" cy="192" r="2.2" fill="#34D399"/>
  <rect x="68" y="205" width="124" height="10" rx="2" fill="#CBD5E1"/>
  <rect x="68" y="221" width="124" height="42" rx="3" fill="#F1F5F9"/>
  <rect x="76" y="229" width="90" height="4" rx="2" fill="#94A3B8"/>
  <rect x="76" y="238" width="70" height="4" rx="2" fill="#94A3B8"/>
  <rect x="76" y="247" width="80" height="4" rx="2" fill="#94A3B8"/>
  <text x="130.0" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">すぐに中身が見える</text>

  <!-- ===== ハイドレーション ===== -->
  <line x1="30" y1="340" x2="870" y2="340" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="30" y="328" width="132" height="24" rx="12" fill="#374151"/>
  <text x="96" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ハイドレーション</text>
  <rect x="290" y="368" width="340" height="62" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="460" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B21B6">届いたJSがHTMLにくっつく</text>
  <text x="460" y="414" text-anchor="middle" font-size="12" fill="#4B5563">ボタンなどが押せるようになる（以降はSPAのように動く）</text>
  <line x1="288" y1="399" x2="212" y2="399" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="60" y="355" width="140" height="86" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M60,361 a6,6 0 0 1 6,-6 h128 a6,6 0 0 1 6,6 v8 h-140 z" fill="#E5E7EB"/>
  <circle cx="68" cy="362" r="2.2" fill="#F87171"/><circle cx="75" cy="362" r="2.2" fill="#FBBF24"/><circle cx="82" cy="362" r="2.2" fill="#34D399"/>
  <rect x="68" y="375" width="124" height="10" rx="2" fill="#CBD5E1"/>
  <rect x="68" y="391" width="124" height="42" rx="3" fill="#F1F5F9"/>
  <rect x="76" y="399" width="90" height="4" rx="2" fill="#94A3B8"/>
  <rect x="76" y="408" width="70" height="4" rx="2" fill="#94A3B8"/>
  <rect x="76" y="417" width="80" height="4" rx="2" fill="#94A3B8"/>
  <rect x="152" y="417" width="34" height="13" rx="4" fill="#2563EB"/>
  <text x="169" y="427" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">購入</text>
  <text x="130.0" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">操作できるようになる</text>

  <!-- ===== 特徴 ===== -->
  <rect x="30" y="480" width="840" height="140" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="55" y="512" font-size="13" fill="#047857">◯ 最初の表示が速く、SEOにも強い</text>
  <text x="55" y="538" font-size="13" fill="#047857">◯ いつアクセスしても最新のデータを表示できる</text>
  <text x="465" y="512" font-size="13" fill="#B91C1C">✕ リクエストのたびに処理するのでサーバー負荷が高い</text>
  <text x="465" y="538" font-size="13" fill="#B91C1C">✕ Node.js などのサーバーを動かし続ける必要がある</text>
  <line x1="50" y1="570" x2="850" y2="570" stroke="#E5E7EB" stroke-width="1"/>
  <text x="55" y="598" font-size="13" fill="#4B5563"><tspan font-weight="bold" fill="#111827">向いている例：</tspan>ECサイト・ニュースサイト・SNS（Next.js、Nuxt など）</text>
</svg>
