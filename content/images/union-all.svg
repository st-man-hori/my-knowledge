<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="650" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">UNION ALL</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">2つのSELECT結果を縦に積み重ね、重複する行もそのまま残す</text>

  <!-- ===== LEFT JOIN の結果 ===== -->
  <text x="210" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">① LEFT JOIN の結果</text>
  <rect x="60" y="120" width="300" height="34" fill="#3B82F6"/>
  <text x="95" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="190" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <text x="305" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="60" y="154" width="300" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="176" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="190" y="176" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="305" y="176" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="60" y="188" width="300" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="210" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="190" y="210" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="305" y="210" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="60" y="222" width="300" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="244" text-anchor="middle" font-size="14" fill="#1F2937">3</text>
  <text x="190" y="244" text-anchor="middle" font-size="14" fill="#1F2937">佐藤</text>
  <text x="305" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <rect x="60" y="256" width="300" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="278" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="190" y="278" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <text x="305" y="278" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <line x1="130" y1="120" x2="130" y2="290" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="290" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 積み重ねを示す＋ -->
  <text x="210" y="314" text-anchor="middle" font-size="20" font-weight="bold" fill="#6B7280">＋</text>

  <!-- ===== RIGHT JOIN の結果 ===== -->
  <text x="210" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">② RIGHT JOIN の結果</text>
  <rect x="60" y="352" width="300" height="34" fill="#10B981"/>
  <text x="95" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="190" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <text x="305" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <rect x="60" y="386" width="300" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="408" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="190" y="408" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="305" y="408" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="60" y="420" width="300" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="442" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="190" y="442" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="305" y="442" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="60" y="454" width="300" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="476" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="190" y="476" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <text x="305" y="476" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <rect x="60" y="488" width="300" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="95" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="190" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="305" y="510" text-anchor="middle" font-size="14" fill="#1F2937">22</text>
  <line x1="130" y1="352" x2="130" y2="522" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="250" y1="352" x2="250" y2="522" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 重複の注記 -->
  <path d="M370,388 L378,388 L378,486 L370,486" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="386" y="432" font-size="13" font-weight="bold" fill="#B45309">①と重複</text>
  <text x="386" y="452" font-size="13" font-weight="bold" fill="#B45309">→ そのまま残す</text>

  <!-- ===== 矢印 ===== -->
  <text x="525" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">UNION ALL</text>
  <line x1="470" y1="322" x2="586" y2="322" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== UNION ALL の結果 ===== -->
  <text x="730" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">UNION ALL の結果</text>
  <rect x="600" y="170" width="260" height="34" fill="#6B7280"/>
  <text x="630" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ID</text>
  <text x="710" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">名前</text>
  <text x="810" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">年齢</text>
  <!-- ①由来 -->
  <rect x="600" y="204" width="260" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="226" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="710" y="226" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="810" y="226" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="600" y="238" width="260" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="260" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="710" y="260" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="810" y="260" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="600" y="272" width="260" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="294" text-anchor="middle" font-size="14" fill="#1F2937">3</text>
  <text x="710" y="294" text-anchor="middle" font-size="14" fill="#1F2937">佐藤</text>
  <text x="810" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <rect x="600" y="306" width="260" height="34" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="328" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="710" y="328" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <text x="810" y="328" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <!-- ②由来 -->
  <rect x="600" y="340" width="260" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="362" text-anchor="middle" font-size="14" fill="#1F2937">1</text>
  <text x="710" y="362" text-anchor="middle" font-size="14" fill="#1F2937">田中</text>
  <text x="810" y="362" text-anchor="middle" font-size="14" fill="#1F2937">25</text>
  <rect x="600" y="374" width="260" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="396" text-anchor="middle" font-size="14" fill="#1F2937">2</text>
  <text x="710" y="396" text-anchor="middle" font-size="14" fill="#1F2937">鈴木</text>
  <text x="810" y="396" text-anchor="middle" font-size="14" fill="#1F2937">30</text>
  <rect x="600" y="408" width="260" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="430" text-anchor="middle" font-size="14" fill="#1F2937">4</text>
  <text x="710" y="430" text-anchor="middle" font-size="14" fill="#1F2937">高橋</text>
  <text x="810" y="430" text-anchor="middle" font-size="14" fill="#1F2937">28</text>
  <rect x="600" y="442" width="260" height="34" fill="#D1FAE5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="630" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="710" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">NULL</text>
  <text x="810" y="464" text-anchor="middle" font-size="14" fill="#1F2937">22</text>
  <line x1="660" y1="170" x2="660" y2="476" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="760" y1="170" x2="760" y2="476" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 重複行のマーク -->
  <path d="M866,342 L874,342 L874,440 L866,440" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- 凡例 -->
  <rect x="620" y="492" width="14" height="14" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="640" y="504" font-size="12" fill="#4B5563">①由来</text>
  <rect x="700" y="492" width="14" height="14" fill="#D1FAE5" stroke="#10B981"/>
  <text x="720" y="504" font-size="12" fill="#4B5563">②由来</text>
  <text x="730" y="530" text-anchor="middle" font-size="12" fill="#B45309">ID 1・2・4 の行が2回ずつ含まれる（計8行）</text>

  <!-- ===== 区切り線 ===== -->
  <line x1="40" y1="555" x2="860" y2="555" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ===== UNION と UNION ALL ===== -->
  <rect x="60" y="572" width="380" height="60" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="80" y="597" font-size="15" font-weight="bold" fill="#374151">UNION</text>
  <text x="80" y="619" font-size="13" fill="#374151">重複する行を1行にまとめる → 結果は5行</text>
  <rect x="460" y="572" width="380" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="597" font-size="15" font-weight="bold" fill="#B45309">UNION ALL</text>
  <text x="480" y="619" font-size="13" fill="#374151">重複も残してそのまま積む → 結果は8行</text>
</svg>
