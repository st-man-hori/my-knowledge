<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="580" fill="#FFFFFF"/>

  <!-- タイトル -->
  <text x="450" y="48" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">ウォーターフォール型開発</text>
  <text x="450" y="78" text-anchor="middle" font-size="15" fill="#4B5563">工程を上から下へ、滝のように順番に進めていく</text>

  <!-- 1. 要件定義 -->
  <rect x="60" y="110" width="200" height="56" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="160" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">要件定義</text>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#1F2937">何を作るかを決める</text>
  <path d="M260,138 H292 V180" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2. 基本設計 -->
  <rect x="170" y="182" width="200" height="56" rx="8" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="270" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">基本設計</text>
  <text x="270" y="227" text-anchor="middle" font-size="12" fill="#1F2937">画面・機能を設計する</text>
  <path d="M370,210 H402 V252" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 3. 詳細設計 -->
  <rect x="280" y="254" width="200" height="56" rx="8" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="380" y="279" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">詳細設計</text>
  <text x="380" y="299" text-anchor="middle" font-size="12" fill="#1F2937">内部の構造を設計する</text>
  <path d="M480,282 H512 V324" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 4. 実装 -->
  <rect x="390" y="326" width="200" height="56" rx="8" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="490" y="351" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">実装</text>
  <text x="490" y="371" text-anchor="middle" font-size="12" fill="#1F2937">プログラミングする</text>
  <path d="M590,354 H622 V396" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 5. テスト -->
  <rect x="500" y="398" width="200" height="56" rx="8" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="600" y="423" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">テスト</text>
  <text x="600" y="443" text-anchor="middle" font-size="12" fill="#EFF6FF">動作・品質を確認する</text>
  <path d="M700,426 H732 V468" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 6. リリース・運用 -->
  <rect x="610" y="470" width="200" height="56" rx="8" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="710" y="495" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">リリース・運用</text>
  <text x="710" y="515" text-anchor="middle" font-size="12" fill="#EFF6FF">本番公開と保守</text>

  <!-- 前の工程には戻らない -->
  <path d="M390,354 H340 V314" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <line x1="357" y1="346" x2="373" y2="362" stroke="#DC2626" stroke-width="3"/>
  <line x1="373" y1="346" x2="357" y2="362" stroke="#DC2626" stroke-width="3"/>
  <text x="320" y="380" text-anchor="end" font-size="14" font-weight="bold" fill="#DC2626">原則、前の工程には戻らない</text>
  <text x="320" y="400" text-anchor="end" font-size="12" fill="#4B5563">前の工程が完了してから次へ進む</text>
</svg>
