# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: st-man-hori's Notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ja-JP
  baseUrl: my-knowledge.st-man.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    # Font loading is owned by the `fonts` plugin below (M PLUS 1p); keeping this
    # on "googleFonts" made Head.tsx fetch a second, unused Noto Sans JP stylesheet
    # on every page.
    fontOrigin: local
    cdnCaching: true
    typography:
      header: M PLUS 1p
      body: M PLUS 1p
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f8fafc"
        lightgray: "#e2e8f0"
        gray: "#94a3b8"
        darkgray: "#334155"
        dark: "#0f172a"
        secondary: "#2563eb"
        tertiary: "#0ea5e9"
        highlight: rgba(37, 99, 235, 0.08)
        textHighlight: "#fff23688"
      darkMode:
        light: "#101216"
        lightgray: "#2a2f3a"
        gray: "#707a8a"
        darkgray: "#c9d1d9"
        dark: "#e6e9ef"
        secondary: "#7aa2f7"
        tertiary: "#38bdf8"
        highlight: rgba(122, 162, 247, 0.1)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # External links get target="_blank" automatically, so plain markdown
      # links can be used instead of raw <a> tags.
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      fontOrigin: googleFonts
      header: M PLUS 1p
      title: M PLUS 1p
      body: M PLUS 1p
      interface: M PLUS 1p
      h1: M PLUS 1p
      h2: M PLUS 1p
      h3: M PLUS 1p
      h4: M PLUS 1p
      h5: M PLUS 1p
      h6: M PLUS 1p
      code: JetBrains Mono
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: things
      # mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: false
  - source: "./plugins/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "./plugins/robots-txt"
    enabled: true
  - source: "./plugins/github-link"
    enabled: true
    options:
      link: https://github.com/st-man-hori/my-knowledge
    layout:
      position: left
      priority: 32
      group: toolbar
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      # Right below the article title (10), above note-properties (15)
      # and content-meta (20).
      priority: 12
  - source: "./plugins/avatar"
    enabled: false
    options:
      src: static/icon.png
      alt: "st-man-hori"
    layout:
      position: left
      priority: 9
      group: brand
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
      group: brand
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      limit: 15
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 40
  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderDefaultState: open
      folderClickBehavior: link
      useSavedState: true
    order: 50
    layout:
      position: left
      priority: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
    brand:
      priority: 9
      direction: row
      gap: 0.6rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
